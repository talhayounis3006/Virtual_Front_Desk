<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)" rx="16"/>
  <!-- Calendar background -->
  <rect x="250" y="100" width="300" height="320" rx="12" fill="#2d2d44" stroke="#c9a96e" stroke-width="1" opacity="0.8"/>
  <!-- Calendar header -->
  <rect x="250" y="100" width="300" height="50" rx="12" fill="#c9a96e" opacity="0.15"/>
  <text x="400" y="132" text-anchor="middle" fill="#e8d5a3" font-family="serif" font-size="16" opacity="0.9">Smart Booking</text>
  <!-- Calendar grid -->
  <line x1="290" y1="170" x2="510" y2="170" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <line x1="290" y1="210" x2="510" y2="210" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <line x1="290" y1="250" x2="510" y2="250" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <line x1="290" y1="290" x2="510" y2="290" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <line x1="290" y1="330" x2="510" y2="330" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <line x1="290" y1="370" x2="510" y2="370" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>
  <!-- Day markers -->
  <text x="310" y="192" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="7" opacity="0.5">MON</text>
  <text x="370" y="192" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="7" opacity="0.5">TUE</text>
  <text x="430" y="192" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="7" opacity="0.5">WED</text>
  <text x="490" y="192" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="7" opacity="0.5">THU</text>
  <!-- Booked slots -->
  <rect x="295" y="215" width="60" height="18" rx="4" fill="#c9a96e" opacity="0.2"/>
  <text x="325" y="228" text-anchor="middle" fill="#c9a96e" font-family="sans-serif" font-size="7" opacity="0.7">09:00 AM</text>
  <rect x="355" y="215" width="60" height="18" rx="4" fill="#5a8f6a" opacity="0.2"/>
  <text x="385" y="228" text-anchor="middle" fill="#5a8f6a" font-family="sans-serif" font-size="7" opacity="0.7">10:00 AM</text>
  <rect x="295" y="255" width="60" height="18" rx="4" fill="#c9a96e" opacity="0.15"/>
  <text x="325" y="268" text-anchor="middle" fill="#c9a96e" font-family="sans-serif" font-size="7" opacity="0.6">02:00 PM</text>
  <rect x="420" y="255" width="60" height="18" rx="4" fill="#c9a96e" opacity="0.2"/>
  <text x="450" y="268" text-anchor="middle" fill="#c9a96e" font-family="sans-serif" font-size="7" opacity="0.7">03:00 PM</text>
  <!-- Notification popup -->
  <rect x="290" y="300" width="220" height="55" rx="8" fill="#3d3d54" stroke="#c9a96e" stroke-width="0.5" opacity="0.9"/>
  <circle cx="310" cy="318" r="8" fill="#5a8f6a" opacity="0.3"/>
  <path d="M306 318 L310 323 L318 313" fill="none" stroke="#5a8f6a" stroke-width="1.5"/>
  <text x="330" y="315" fill="#e8d5a3" font-family="sans-serif" font-size="8" opacity="0.8">New booking confirmed!</text>
  <text x="330" y="330" fill="#b8b6b0" font-family="sans-serif" font-size="7" opacity="0.5">Sarah J. - 3:00 PM Consultation</text>
  <!-- Calendar dots -->
  <circle cx="700" cy="100" r="60" fill="#c9a96e" opacity="0.03"/>
  <circle cx="100" cy="420" r="50" fill="#c9a96e" opacity="0.03"/>
  <!-- Bottom text -->
  <text x="400" y="455" text-anchor="middle" fill="#e8d5a3" font-family="serif" font-size="18" opacity="0.8">Seamless Scheduling</text>
  <text x="400" y="475" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="11" opacity="0.5">Real-time availability & auto-booking</text>
</svg>