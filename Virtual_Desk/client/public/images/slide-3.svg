<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)" rx="16"/>
  <!-- Chat bubbles -->
  <!-- Left bubble - customer -->
  <rect x="120" y="120" width="260" height="55" rx="16" fill="#3d3d54" stroke="#c9a96e" stroke-width="0.5" opacity="0.85"/>
  <rect x="120" y="120" width="260" height="55" rx="16" fill="#c9a96e" opacity="0.05"/>
  <text x="140" y="142" fill="#b8b6b0" font-family="sans-serif" font-size="8" opacity="0.7">Customer</text>
  <text x="140" y="160" fill="#e8d5a3" font-family="sans-serif" font-size="11" opacity="0.9">Hi! I need to book an</text>
  <text x="140" y="176" fill="#e8d5a3" font-family="sans-serif" font-size="11" opacity="0.9">appointment for next week.</text>
  <!-- Right bubble - AI assistant -->
  <rect x="420" y="200" width="280" height="70" rx="16" fill="#2d2d44" stroke="#5a8f6a" stroke-width="0.5" opacity="0.85"/>
  <rect x="420" y="200" width="280" height="70" rx="16" fill="#5a8f6a" opacity="0.05"/>
  <text x="440" y="222" fill="#5a8f6a" font-family="sans-serif" font-size="8" opacity="0.7">AI Assistant</text>
  <text x="440" y="240" fill="#c9a96e" font-family="sans-serif" font-size="11" opacity="0.9">I'd be happy to help! We have</text>
  <text x="440" y="256" fill="#c9a96e" font-family="sans-serif" font-size="11" opacity="0.9">availability on Tuesday at 2 PM</text>
  <text x="440" y="272" fill="#c9a96e" font-family="sans-serif" font-size="11" opacity="0.9">or Thursday at 10 AM.</text>
  <!-- Left bubble - customer reply -->
  <rect x="130" y="300" width="240" height="40" rx="16" fill="#3d3d54" stroke="#c9a96e" stroke-width="0.5" opacity="0.85"/>
  <text x="150" y="322" fill="#e8d5a3" font-family="sans-serif" font-size="11" opacity="0.9">Tuesday at 2 PM works great!</text>
  <!-- Right bubble - AI confirmation -->
  <rect x="450" y="365" width="250" height="55" rx="16" fill="#2d2d44" stroke="#5a8f6a" stroke-width="0.5" opacity="0.85"/>
  <text x="470" y="387" fill="#5a8f6a" font-family="sans-serif" font-size="8" opacity="0.7">AI Assistant</text>
  <text x="470" y="402" fill="#c9a96e" font-family="sans-serif" font-size="11" opacity="0.9">Perfect! Your appointment is</text>
  <text x="470" y="418" fill="#c9a96e" font-family="sans-serif" font-size="11" opacity="0.9">confirmed. You'll get a reminder.</text>
  <!-- Robot/AI icon -->
  <circle cx="680" cy="90" r="25" fill="#c9a96e" opacity="0.1"/>
  <circle cx="680" cy="90" r="15" fill="#c9a96e" opacity="0.2"/>
  <circle cx="680" cy="90" r="8" fill="#c9a96e" opacity="0.3"/>
  <!-- Typing indicator dots animated -->
  <circle cx="680" cy="150" r="3" fill="#5a8f6a" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="150" r="3" fill="#5a8f6a" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="3" fill="#5a8f6a" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Decorative -->
  <circle cx="100" cy="450" r="70" fill="#c9a96e" opacity="0.03"/>
  <circle cx="750" cy="400" r="45" fill="#c9a96e" opacity="0.03"/>
  <!-- Bottom text -->
  <text x="400" y="465" text-anchor="middle" fill="#e8d5a3" font-family="serif" font-size="18" opacity="0.8">AI-Powered Support</text>
  <text x="400" y="485" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="11" opacity="0.5">24/7 Intelligent Customer Assistance</text>
</svg>