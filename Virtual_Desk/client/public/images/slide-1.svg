<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2d2d44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a96e"/>
      <stop offset="100%" style="stop-color:#e8d5a3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)" rx="16"/>
  <!-- Desk -->
  <rect x="200" y="320" width="400" height="20" rx="4" fill="#2d2d44" stroke="#c9a96e" stroke-width="1"/>
  <rect x="220" y="280" width="360" height="40" rx="6" fill="#3d3d54"/>
  <!-- Monitor -->
  <rect x="340" y="210" width="120" height="70" rx="4" fill="#1a1a2e" stroke="#c9a96e" stroke-width="1"/>
  <rect x="395" y="280" width="10" height="40" fill="#3d3d54"/>
  <rect x="360" y="280" width="80" height="6" rx="2" fill="#2d2d44"/>
  <!-- Screen glow -->
  <rect x="346" y="216" width="108" height="58" rx="3" fill="#0a0a14"/>
  <circle cx="400" cy="230" r="12" fill="#c9a96e" opacity="0.3"/>
  <circle cx="400" cy="250" r="6" fill="#c9a96e" opacity="0.2"/>
  <rect x="370" y="240" width="60" height="4" rx="2" fill="#c9a96e" opacity="0.3"/>
  <!-- Welcome text on screen -->
  <text x="400" y="245" text-anchor="middle" fill="#c9a96e" font-family="sans-serif" font-size="10" opacity="0.6">VIRTUAL FRONT DESK</text>
  <!-- Headset -->
  <ellipse cx="400" cy="200" rx="18" ry="6" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <path d="M382 200 Q380 180 390 175" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <path d="M418 200 Q420 180 410 175" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <!-- Call indicator dots -->
  <circle cx="360" cy="295" r="3" fill="#5a8f6a" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="370" y="298" fill="#5a8f6a" font-family="sans-serif" font-size="8" opacity="0.7">Online</text>
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="#c9a96e" opacity="0.03"/>
  <circle cx="700" cy="400" r="100" fill="#c9a96e" opacity="0.03"/>
  <!-- Clock -->
  <circle cx="650" cy="120" r="25" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  <line x1="650" y1="120" x2="650" y2="105" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  <line x1="650" y1="120" x2="660" y2="115" stroke="#c9a96e" stroke-width="1.5" opacity="0.4"/>
  <text x="650" y="160" text-anchor="middle" fill="#c9a96e" font-family="sans-serif" font-size="10" opacity="0.4">24/7</text>
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" fill="#e8d5a3" font-family="serif" font-size="18" opacity="0.8">Professional Reception</text>
  <text x="400" y="400" text-anchor="middle" fill="#b8b6b0" font-family="sans-serif" font-size="11" opacity="0.5">Always Open, Always Professional</text>
</svg>